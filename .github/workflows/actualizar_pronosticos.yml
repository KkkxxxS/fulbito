name: Actualizar pronósticos
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python pronosticos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add pronosticos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualiza pronosticos.json"
          git push
