name: Actualizar pronósticos
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restaurar telemetría acumulada (append-only) del Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Sin este paso cada corrida parte del JSONL commiteado (viejo) y el
          # asset del Release se sobrescribe perdiendo el historial acumulado.
          gh release download artifacts-daily --pattern pronosticos_historicos.jsonl --clobber || true
          gh release download artifacts-daily --pattern bitacora_recalibracion.jsonl --clobber || true
      - name: Validar paridad del modelo (Python vs JS)
        run: python test_paridad.py
      - name: Suite de recalibración (12 escenarios)
        run: python test_recalibracion.py
      - run: python pronosticos.py
      - name: Recalibración supervisada (diagnóstico + propuesta)
        id: recalibracion
        continue-on-error: true
        run: |
          salida=$(python recalibracion.py --modo propuesta | tee /tmp/recalibracion.log) || true
          id_prop=$(grep -oP 'RECALIBRACION_PROPUESTA_NUEVA=\K.*' <<< "$salida" | head -n1 || true)
          echo "id=$id_prop" >> "$GITHUB_OUTPUT"
          cat /tmp/recalibracion.log
      - name: Subir artefactos diarios a GitHub Release (evita crecimiento del repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node upload-artifacts-to-release.js
      - name: Registrar pronósticos nuevos en el historial público (idempotente)
        continue-on-error: true
        env:
          FULBITO_BACKEND_URL: ${{ secrets.FULBITO_BACKEND_URL }}
          HISTORIAL_API_KEY: ${{ secrets.HISTORIAL_API_KEY }}
        run: |
          if [ -z "$FULBITO_BACKEND_URL" ] || [ -z "$HISTORIAL_API_KEY" ]; then
            echo "Faltan FULBITO_BACKEND_URL o HISTORIAL_API_KEY: se omite el registro."
            exit 0
          fi
          node sync-historial.js
      - name: Liquidar track record server-side (cruce pronósticos × resultados)
        continue-on-error: true
        env:
          BACKEND_URL: ${{ secrets.FULBITO_BACKEND_URL }}
          HISTORIAL_API_KEY: ${{ secrets.HISTORIAL_API_KEY }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$HISTORIAL_API_KEY" ]; then
            echo "Faltan FULBITO_BACKEND_URL o HISTORIAL_API_KEY: se omite la liquidación."
            exit 0
          fi
          curl -sS -X POST "$BACKEND_URL/api/historial/liquidar" \
            -H "X-Api-Key: $HISTORIAL_API_KEY" \
            -H "Content-Type: application/json" \
            --max-time 60
          echo
      - name: Crear PR de la propuesta (aprobación manual)
        if: steps.recalibracion.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ steps.recalibracion.outputs.id }}"
          RAMA="recalibracion/$ID"
          git checkout -b "$RAMA"
          git add propuesta_recalibracion.json
          git commit -m "bot: propuesta de recalibración $ID"
          git push -u origin "$RAMA"
          if ! gh pr create \
            --title "Recalibración $ID — requiere tu aprobación o rechazo" \
            --body "Propuesta generada automáticamente por el sistema de recalibración (diseño aprobado). Revisá \`propuesta_recalibracion.json\` en este PR.

          - **Aprobar:** haz merge del PR. Los overrides quedan en \`parametros_aprobados.json\`, que \`pronosticos.py\` ya consume: se aplican en la siguiente corrida diaria.
          - **Rechazar:** cierra el PR y registra el motivo con: \`python recalibracion.py --rechazar $ID --motivo \"...\"\` (queda en la bitácora para Transparencia)." \
            --head "$RAMA" --base main; then
            # Fallback: si no se pudo crear el PR, la propuesta se publica en main
            git checkout main
            git add propuesta_recalibracion.json
            git diff --cached --quiet || git commit -m "bot: propuesta de recalibración $ID (sin PR, pendiente de revisión)"
            git push
          fi
