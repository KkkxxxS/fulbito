name: Actualizar pronósticos
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validar paridad del modelo (Python vs JS)
        run: python test_paridad.py
      - name: Suite de recalibración (12 escenarios)
        run: python test_recalibracion.py
      - run: python pronosticos.py
      - name: Recalibración supervisada (diagnóstico + propuesta)
        id: recalibracion
        continue-on-error: true
        run: |
          salida=$(python recalibracion.py --modo propuesta | tee /tmp/recalibracion.log) || true
          id_prop=$(grep -oP 'RECALIBRACION_PROPUESTA_NUEVA=\K.*' <<< "$salida" | head -n1 || true)
          echo "id=$id_prop" >> "$GITHUB_OUTPUT"
          cat /tmp/recalibracion.log
      - name: Subir artefactos diarios a GitHub Release (evita crecimiento del repo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node upload-artifacts-to-release.js
      - name: Crear PR de la propuesta (aprobación manual)
        if: steps.recalibracion.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ID="${{ steps.recalibracion.outputs.id }}"
          RAMA="recalibracion/$ID"
          git checkout -b "$RAMA"
          git add propuesta_recalibracion.json
          git commit -m "bot: propuesta de recalibración $ID"
          git push -u origin "$RAMA"
          if ! gh pr create \
            --title "Recalibración $ID — requiere tu aprobación o rechazo" \
            --body "Propuesta generada automáticamente por el sistema de recalibración (diseño aprobado). Revisá \`propuesta_recalibracion.json\` en este PR.

          - **Aprobar:** haz merge del PR. Los overrides quedan en \`parametros_aprobados.json\`, que \`pronosticos.py\` ya consume: se aplican en la siguiente corrida diaria.
          - **Rechazar:** cierra el PR y registra el motivo con: \`python recalibracion.py --rechazar $ID --motivo \"...\"\` (queda en la bitácora para Transparencia)." \
            --head "$RAMA" --base main; then
            # Fallback: si no se pudo crear el PR, la propuesta se publica en main
            git checkout main
            git add propuesta_recalibracion.json
            git diff --cached --quiet || git commit -m "bot: propuesta de recalibración $ID (sin PR, pendiente de revisión)"
            git push
          fi
