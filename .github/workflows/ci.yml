name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fulbito
          POSTGRES_PASSWORD: fulbito
          POSTGRES_DB: fulbito_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias Python
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Instalar dependencias Node
        run: npm ci
      - name: Sintaxis y paridad del frontend (npm check)
        run: npm run check
      - name: Paridad numérica Python <-> JS
        run: npm run test:parity
      - name: Suite de recalibración (12 escenarios)
        run: npm test
      - name: Persistencia del historial del servidor (SQLite)
        run: npm run test:server
      - name: Utilidades de seguridad de auth (sin DB)
        run: npm run test:seguridad
      - name: Auth e historial personal del servidor (PostgreSQL)
        run: npm run test:auth
        env:
          DATABASE_URL: postgresql://fulbito:fulbito@localhost:5432/fulbito_test
          DATABASE_SSL: 'false'
      - name: Liquidación server-side del track record
        run: npm run test:liquidacion
      - name: Verificación del modelo JS
        run: npm run verify
      - name: Smoke test del frontend
        run: npm run smoke
      - name: Utilidades del frontend (escape/i18n)
        run: npm run test:utils
      - name: Despachador de eventos (sin handlers inline)
        run: npm run test:events