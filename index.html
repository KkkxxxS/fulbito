<!DOCTYPE html>
<html lang="es-PERU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulbito</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bloqueado">

<div class="contenedor" id="inicio">
    <h1>Bienvenido a fulbito</h1>
    <p>full fulbitoo.</p>
    <a href="#pronosticos" class="boton-redireccion" onclick="entrar()">entra aqui</a>
</div>

<section id="pronosticos" class="seccion-pronosticos">
    <h2>Pronósticos de hoy</h2>

    <div class="pestañas-fecha">
        <button class="pestaña activa" onclick="cambiarFecha('hoy', event)">Hoy</button>
        <button class="pestaña" onclick="cambiarFecha('manana', event)">Mañana</button>
        <button class="pestaña" onclick="cambiarFecha('semana', event)">Esta semana</button>
    </div>

    <div id="contenedor-partidos">
        <p style="text-align:center; color:#8fa896;">Cargando partidos...</p>
    </div>

    <div id="bloque-combinadas"></div>

    <div id="bloque-historial"></div>

</section>

<script>
  // ============ CONFIGURACION ============
  const BACKEND_URL = "https://fulbito-forh.onrender.com";
  const COMPETICIONES = "PL,PD,BL1,SA,FL1,CL";

  const cache = {};

  function formatearFecha(date) {
    const anio = date.getFullYear();
    const mes = String(date.getMonth() + 1).padStart(2, '0');
    const dia = String(date.getDate()).padStart(2, '0');
    return `${anio}-${mes}-${dia}`;
  }

  function fechaLocalDePartido(utcDateStr) {
    return formatearFecha(new Date(utcDateStr));
  }

  function entrar() {
    document.body.classList.remove('bloqueado');
    document.getElementById('inicio').style.display = 'none';
  }

  async function obtenerPartidos(fechaInicio, fechaFin) {
    const claveCache = `matches-${fechaInicio}-${fechaFin}`;
    if (cache[claveCache]) return cache[claveCache];

    try {
      const url = `${BACKEND_URL}/api/partidos?competitions=${COMPETICIONES}&dateFrom=${fechaInicio}&dateTo=${fechaFin}`;
      const resp = await fetch(url);
      const datos = await resp.json();

      if (datos.error || datos.errorCode) {
        console.error("Respuesta con error de la API:", datos);
        return { error: true, mensaje: datos.message || datos.error || "Error desconocido de la API" };
      }

      const partidos = (datos.matches || []).filter(p => p.status === 'SCHEDULED' || p.status === 'TIMED');
      cache[claveCache] = partidos;
      return partidos;
    } catch (e) {
      console.error("Error trayendo partidos", e);
      return { error: true, mensaje: e.message };
    }
  }

  // ============ PROMEDIO DE GOLES POR LIGA ============
  // Cada liga tiene un promedio historico de goles por partido distinto
  // (la Bundesliga anota bastante mas que la Serie A o la Ligue 1, por ejemplo).
  // Usar un solo numero generico para todas las ligas hacia el shrinkage menos preciso
  // en las ligas que se alejan del promedio general. Estos valores son aproximaciones
  // basadas en promedios historicos reales de goles por partido de cada liga (~ultimas temporadas).
  const PROMEDIO_GOLES_POR_LIGA = {
    PL: 1.45,   // Premier League
    PD: 1.35,   // LaLiga
    BL1: 1.55,  // Bundesliga
    SA: 1.30,   // Serie A
    FL1: 1.40,  // Ligue 1
    CL: 1.40,   // Champions League
    DEFAULT: 1.40
  };

  function promedioLiga(codigoLiga) {
    return PROMEDIO_GOLES_POR_LIGA[codigoLiga] ?? PROMEDIO_GOLES_POR_LIGA.DEFAULT;
  }

  // ============ CONFIABILIDAD DE LA DATA (shrinkage bayesiano) ============
  const PARTIDOS_CONFIANZA_PLENA = 10;
  const PARTIDOS_MINIMOS_CONFIABLES = 5;

  function aplicarShrinkage(valor, partidosJugados, promedioLigaEquipo) {
    const peso = Math.min(partidosJugados / PARTIDOS_CONFIANZA_PLENA, 1);
    return valor * peso + promedioLigaEquipo * (1 - peso);
  }

  // ============ PONDERACION POR RECENCIA ============
  function pesosRecencia(cantidad) {
    const base = [1.0, 0.8, 0.65, 0.5, 0.4, 0.32, 0.26, 0.2];
    const pesos = [];
    for (let i = 0; i < cantidad; i++) {
      pesos.push(base[i] !== undefined ? base[i] : 0.15);
    }
    return pesos;
  }

  function promedioPonderado(valores, pesos) {
    if (valores.length === 0) return 0;
    let sumaValores = 0, sumaPesos = 0;
    for (let i = 0; i < valores.length; i++) {
      sumaValores += valores[i] * pesos[i];
      sumaPesos += pesos[i];
    }
    return sumaPesos > 0 ? sumaValores / sumaPesos : 0;
  }

  // ============ RACHA / TENDENCIA RECIENTE ============
  // Compara el rendimiento de los ultimos partidos "recientes" contra los mas viejos
  // de la misma muestra, para saber si el equipo viene mejorando o empeorando.
  function calcularTendencia(partidosOrdenados, teamId) {
    if (partidosOrdenados.length < 4) return { direccion: 'neutral', racha: [] };

    const puntosPorPartido = partidosOrdenados.map(p => {
      const esLocal = p.homeTeam.id === teamId;
      const golesEquipo = (esLocal ? p.score.fullTime.home : p.score.fullTime.away) ?? 0;
      const golesRival = (esLocal ? p.score.fullTime.away : p.score.fullTime.home) ?? 0;
      if (golesEquipo > golesRival) return { pts: 3, r: 'G' };
      if (golesEquipo === golesRival) return { pts: 1, r: 'E' };
      return { pts: 0, r: 'P' };
    });

    const mitad = Math.floor(puntosPorPartido.length / 2);
    const recientes = puntosPorPartido.slice(0, mitad);
    const antiguos = puntosPorPartido.slice(mitad);

    const promRecientes = recientes.reduce((a, b) => a + b.pts, 0) / recientes.length;
    const promAntiguos = antiguos.reduce((a, b) => a + b.pts, 0) / antiguos.length;

    let direccion = 'neutral';
    if (promRecientes - promAntiguos >= 0.5) direccion = 'subiendo';
    else if (promAntiguos - promRecientes >= 0.5) direccion = 'bajando';

    // Racha visual: resultados del mas viejo al mas reciente (izquierda a derecha), max 5
    const racha = puntosPorPartido.slice(0, 5).reverse().map(x => x.r);

    return { direccion, racha };
  }

  async function obtenerStatsEquipo(teamId, codigoLiga) {
    const claveCache = `stats-${teamId}`;
    if (cache[claveCache]) return cache[claveCache];

    try {
      const url = `${BACKEND_URL}/api/equipo/${teamId}/stats`;
      const resp = await fetch(url);
      const datos = await resp.json();
      const partidos = datos.matches || [];

      const partidosOrdenados = [...partidos].sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));

      let victorias = 0, empates = 0, derrotas = 0;

      const golesFavorLocal = [], golesContraLocal = [];
      const golesFavorVisita = [], golesContraVisita = [];
      const golesFavorTodos = [], golesContraTodos = [];

      partidosOrdenados.forEach(p => {
        const esLocal = p.homeTeam.id === teamId;
        const golesEquipo = (esLocal ? p.score.fullTime.home : p.score.fullTime.away) ?? 0;
        const golesRival = (esLocal ? p.score.fullTime.away : p.score.fullTime.home) ?? 0;

        if (golesEquipo > golesRival) victorias++;
        else if (golesEquipo === golesRival) empates++;
        else derrotas++;

        golesFavorTodos.push(golesEquipo);
        golesContraTodos.push(golesRival);

        if (esLocal) {
          golesFavorLocal.push(golesEquipo);
          golesContraLocal.push(golesRival);
        } else {
          golesFavorVisita.push(golesEquipo);
          golesContraVisita.push(golesRival);
        }
      });

      const cantidad = partidosOrdenados.length || 1;
      const pesosTodos = pesosRecencia(golesFavorTodos.length);
      const pesosLocal = pesosRecencia(golesFavorLocal.length);
      const pesosVisita = pesosRecencia(golesFavorVisita.length);

      const promTodosFavor = promedioPonderado(golesFavorTodos, pesosTodos);
      const promTodosContra = promedioPonderado(golesContraTodos, pesosTodos);

      const promLocalFavorCrudo = golesFavorLocal.length > 0 ? promedioPonderado(golesFavorLocal, pesosLocal) : promTodosFavor;
      const promLocalContraCrudo = golesContraLocal.length > 0 ? promedioPonderado(golesContraLocal, pesosLocal) : promTodosContra;
      const promVisitaFavorCrudo = golesFavorVisita.length > 0 ? promedioPonderado(golesFavorVisita, pesosVisita) : promTodosFavor;
      const promVisitaContraCrudo = golesContraVisita.length > 0 ? promedioPonderado(golesContraVisita, pesosVisita) : promTodosContra;

      const promLiga = promedioLiga(codigoLiga);
      const promLocalFavor = aplicarShrinkage(promLocalFavorCrudo, golesFavorLocal.length, promLiga);
      const promLocalContra = aplicarShrinkage(promLocalContraCrudo, golesContraLocal.length, promLiga);
      const promVisitaFavor = aplicarShrinkage(promVisitaFavorCrudo, golesFavorVisita.length, promLiga);
      const promVisitaContra = aplicarShrinkage(promVisitaContraCrudo, golesContraVisita.length, promLiga);

      const tendencia = calcularTendencia(partidosOrdenados, teamId);

      const stats = {
        promedioGolesFavor: promTodosFavor,
        promedioGolesContra: promTodosContra,
        puntosPromedio: (victorias * 3 + empates) / cantidad,
        partidosJugados: partidosOrdenados.length,
        local: { golesFavor: promLocalFavor, golesContra: promLocalContra },
        visita: { golesFavor: promVisitaFavor, golesContra: promVisitaContra },
        tendencia
      };

      cache[claveCache] = stats;
      return stats;
    } catch (e) {
      console.error("Error trayendo stats equipo", teamId, e);
      const fallback = { golesFavor: 1, golesContra: 1 };
      return { promedioGolesFavor: 1, promedioGolesContra: 1, puntosPromedio: 1, partidosJugados: 0, local: fallback, visita: fallback, tendencia: { direccion: 'neutral', racha: [] } };
    }
  }

  // ============ ENFRENTAMIENTOS DIRECTOS (HEAD TO HEAD) ============
  // football-data.org expone el historial de enfrentamientos directos entre dos
  // equipos a traves del endpoint de detalle de partido (head2head). Algunos rivales
  // tienen patrones particulares entre si que las estadisticas generales no capturan
  // (un equipo que historicamente le cuesta ganarle a otro, por ejemplo).
  async function obtenerHeadToHead(partidoId) {
    const claveCache = `h2h-${partidoId}`;
    if (cache[claveCache]) return cache[claveCache];

    try {
      const url = `${BACKEND_URL}/api/partido/${partidoId}/h2h`;
      const resp = await fetch(url);
      const datos = await resp.json();

      const h2h = datos.head2head;
      if (!h2h || !h2h.numberOfMatches) {
        const vacio = { disponible: false };
        cache[claveCache] = vacio;
        return vacio;
      }

      const resultado = {
        disponible: true,
        totalPartidos: h2h.numberOfMatches,
        victoriasLocal: h2h.homeTeam?.wins ?? 0,
        empates: h2h.homeTeam?.draws ?? 0,
        victoriasVisita: h2h.awayTeam?.wins ?? 0
      };

      cache[claveCache] = resultado;
      return resultado;
    } catch (e) {
      console.warn("H2H no disponible para este partido (requiere endpoint nuevo en el backend)", e);
      const vacio = { disponible: false };
      cache[claveCache] = vacio;
      return vacio;
    }
  }

  // ============ MODELO DE POISSON ============
  function factorial(n) {
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function poisson(k, lambda) {
    return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
  }

  // ============ CORRECCION DIXON-COLES ============
  const RHO_DIXON_COLES = -0.08;

  function tauDixonColes(golesLocal, golesVisita, lambdaLocal, lambdaVisita, rho) {
    if (golesLocal === 0 && golesVisita === 0) return 1 - (lambdaLocal * lambdaVisita * rho);
    if (golesLocal === 0 && golesVisita === 1) return 1 + (lambdaLocal * rho);
    if (golesLocal === 1 && golesVisita === 0) return 1 + (lambdaVisita * rho);
    if (golesLocal === 1 && golesVisita === 1) return 1 - rho;
    return 1;
  }

  function matrizMarcadores(lambdaLocal, lambdaVisita, maxGoles = 6) {
    const matriz = [];
    let sumaTotal = 0;
    for (let i = 0; i <= maxGoles; i++) {
      matriz[i] = [];
      for (let j = 0; j <= maxGoles; j++) {
        const base = poisson(i, lambdaLocal) * poisson(j, lambdaVisita);
        const ajustado = base * tauDixonColes(i, j, lambdaLocal, lambdaVisita, RHO_DIXON_COLES);
        matriz[i][j] = ajustado;
        sumaTotal += ajustado;
      }
    }
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        matriz[i][j] = matriz[i][j] / sumaTotal;
      }
    }
    return matriz;
  }

  const FACTOR_LOCALIA = 1.1;

  // Ajuste leve por H2H: si un equipo domina claramente el historial directo,
  // le damos un pequeño empujon a su lambda (goles esperados). Es un ajuste
  // conservador (maximo +/-8%) porque el historial directo es una muestra chica
  // y no debe pesar mas que el rendimiento general reciente.
  function factorH2H(h2h, esLocal) {
    if (!h2h || !h2h.disponible || h2h.totalPartidos < 3) return 1;

    const total = h2h.totalPartidos;
    const dominioLocal = (h2h.victoriasLocal - h2h.victoriasVisita) / total;
    const ajusteMax = 0.08;
    const ajuste = Math.max(-ajusteMax, Math.min(ajusteMax, dominioLocal * ajusteMax * 2));

    return esLocal ? (1 + ajuste) : (1 - ajuste);
  }

  function generarPronosticos(statsLocal, statsVisita, nombreLocal, nombreVisita, h2h) {
    let lambdaLocal = (statsLocal.local.golesFavor + statsVisita.visita.golesContra) / 2;
    let lambdaVisita = (statsVisita.visita.golesFavor + statsLocal.local.golesContra) / 2;

    lambdaLocal *= FACTOR_LOCALIA;

    lambdaLocal *= factorH2H(h2h, true);
    lambdaVisita *= factorH2H(h2h, false);

    lambdaLocal = Math.max(lambdaLocal, 0.3);
    lambdaVisita = Math.max(lambdaVisita, 0.3);

    const matriz = matrizMarcadores(lambdaLocal, lambdaVisita);
    const maxGoles = matriz.length - 1;

    let pLocal = 0, pEmpate = 0, pVisita = 0;
    let marcadorTop = { i: 0, j: 0, p: 0 };
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        if (i > j) pLocal += matriz[i][j];
        else if (i === j) pEmpate += matriz[i][j];
        else pVisita += matriz[i][j];

        if (matriz[i][j] > marcadorTop.p) marcadorTop = { i, j, p: matriz[i][j] };
      }
    }

    const favoritoLocal = pLocal >= pVisita;
    const nombreFavorito = favoritoLocal ? nombreLocal : nombreVisita;

    const lineasCandidatas = [1.5, 2.5, 3.5, 4.5];
    let mejorLinea = 3.5, mejorProb = 0;
    lineasCandidatas.forEach(linea => {
      let p = 0;
      for (let i = 0; i <= maxGoles; i++) {
        for (let j = 0; j <= maxGoles; j++) {
          if (i + j < linea) p += matriz[i][j];
        }
      }
      if (p > mejorProb) { mejorProb = p; mejorLinea = linea; }
    });
    const fija = {
      tipo: "fija",
      titulo: "La Fija",
      mercado: "Total de goles",
      seleccion: `Menos de ${mejorLinea}`,
      probabilidad: Math.round(mejorProb * 100)
    };

    const probConFe = favoritoLocal ? (pLocal + pEmpate) : (pVisita + pEmpate);
    const conFe = {
      tipo: "confe",
      titulo: "Con Fe",
      mercado: "Doble oportunidad",
      seleccion: `${nombreFavorito} o Empate (${favoritoLocal ? '1X' : 'X2'})`,
      probabilidad: Math.round(probConFe * 100)
    };

    const lambdaFavorito = favoritoLocal ? lambdaLocal : lambdaVisita;
    const probSonadora = 1 - poisson(0, lambdaFavorito);
    const sonadora = {
      tipo: "sonadora",
      titulo: "La Soñadora",
      mercado: "Equipo marca",
      seleccion: `${nombreFavorito} marca`,
      probabilidad: Math.round(probSonadora * 100)
    };

    let probExtra = 0;
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        const margen = favoritoLocal ? (i - j) : (j - i);
        if (margen >= 2) probExtra += matriz[i][j];
      }
    }
    const extra = {
      tipo: "extra",
      titulo: "Extra",
      mercado: "Hándicap asiático",
      seleccion: `${nombreFavorito} -1`,
      probabilidad: Math.round(probExtra * 100)
    };

    const marcadorProbable = `${marcadorTop.i}-${marcadorTop.j}`;

    function probabilidadConjunta(condiciones) {
      let p = 0;
      for (let i = 0; i <= maxGoles; i++) {
        for (let j = 0; j <= maxGoles; j++) {
          if (condiciones.every(cond => cond(i, j))) p += matriz[i][j];
        }
      }
      return p;
    }

    const esConFe = (i, j) => favoritoLocal ? (i >= j) : (j >= i);
    const esFija = (i, j) => (i + j) < mejorLinea;
    const esSonadora = (i, j) => favoritoLocal ? i >= 1 : j >= 1;

    const combosPartido = [];

    const probA = probabilidadConjunta([esConFe, esFija]);
    combosPartido.push({
      titulo: "Combinada segura",
      tipos: ["confe", "fija"],
      partes: [conFe.seleccion, fija.seleccion],
      probabilidad: Math.round(probA * 100)
    });

    const probB = probabilidadConjunta([esSonadora, esConFe]);
    combosPartido.push({
      titulo: "Combinada con gol",
      tipos: ["sonadora", "confe"],
      partes: [sonadora.seleccion, conFe.seleccion],
      probabilidad: Math.round(probB * 100)
    });

    const partidosMin = Math.min(statsLocal.partidosJugados ?? 0, statsVisita.partidosJugados ?? 0);
    const pocaData = partidosMin < PARTIDOS_MINIMOS_CONFIABLES;

    return {
      fija, conFe, sonadora, extra,
      marcadorProbable, probMarcador: Math.round(marcadorTop.p * 100),
      combosPartido, partidosMin, pocaData,
      favoritoLocal, nombreFavorito
    };
  }

  // ============ ICONOS POR MERCADO ============
  const ICONOS_MERCADO = {
    fija: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
    confe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    sonadora: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 15 9l7 1-5.2 4.9L18.2 22 12 18.3 5.8 22l1.4-7.1L2 10l7-1 3-6.5Z"/></svg>',
    extra: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>'
  };

  function iconoMercado(tipo) {
    return `<span class="fila-icono">${ICONOS_MERCADO[tipo] || ''}</span>`;
  }

  function puntoMercado(tipo) {
    return `<span class="punto-mercado punto-${tipo}"></span>`;
  }

  // ============ RENDER DE RACHA / TENDENCIA ============
  function iconoTendencia(direccion) {
    if (direccion === 'subiendo') return '<span class="tendencia tendencia-sube" title="En alza">▲</span>';
    if (direccion === 'bajando') return '<span class="tendencia tendencia-baja" title="En caída">▼</span>';
    return '<span class="tendencia tendencia-neutral" title="Estable">■</span>';
  }

  function rachaHTML(racha) {
    if (!racha || racha.length === 0) return '';
    return racha.map(r => `<span class="racha-punto racha-${r}">${r}</span>`).join('');
  }

  function bloqueEquipoHTML(nombre, stats, alineacion) {
    return `
      <div class="equipo-info ${alineacion}">
        <div class="equipo-nombre-tend">
          <span class="equipo">${nombre}</span>
          ${iconoTendencia(stats.tendencia.direccion)}
        </div>
        <div class="racha-visual">${rachaHTML(stats.tendencia.racha)}</div>
      </div>
    `;
  }

  // ============ RENDER DE MERCADOS ============
  function filaMercado(datos) {
    return `
      <div class="fila-mercado mercado-${datos.tipo}">
        <div class="fila-header">
          ${iconoMercado(datos.tipo)}
          <span class="fila-porcentaje">${datos.probabilidad}%</span>
        </div>
        <span class="fila-titulo">${datos.titulo}</span>
        <div class="barra-probabilidad">
          <div class="barra-relleno" style="width:${datos.probabilidad}%"></div>
        </div>
        <p class="fila-mercado-nombre">${datos.mercado}</p>
        <p class="fila-seleccion">${datos.seleccion}</p>
      </div>
    `;
  }

  function comboPartidoHTML(combo) {
    const puntos = combo.tipos.map(puntoMercado).join('');
    return `
      <div class="combo-partido">
        <div class="combo-partido-header">
          <span>${puntos}${combo.titulo}</span>
          <span class="combo-partido-pct">${combo.probabilidad}%</span>
        </div>
        <p class="combo-partido-partes">${combo.partes.join(' + ')}</p>
      </div>
    `;
  }

  function h2hHTML(h2h) {
    if (!h2h || !h2h.disponible) return '';
    return `
      <p class="info-h2h">Historial directo (${h2h.totalPartidos} partidos): ${h2h.victoriasLocal}V local · ${h2h.empates}E · ${h2h.victoriasVisita}V visita</p>
    `;
  }

  function crearTarjetaHTML(partido, pronosticos, statsLocal, statsVisita, h2h) {
    const local = partido.homeTeam.name;
    const visita = partido.awayTeam.name;
    const liga = partido.competition.name;
    const fecha = new Date(partido.utcDate);
    const fechaTexto = fecha.toLocaleDateString('es-PE', { day: '2-digit', month: 'short' });
    const horaTexto = fecha.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });

    return `
      <div class="tarjeta-partido" data-partido-id="${partido.id}">
        <div class="encabezado-partido">
          ${bloqueEquipoHTML(local, statsLocal, 'alineacion-izq')}
          <span class="vs">VS</span>
          ${bloqueEquipoHTML(visita, statsVisita, 'alineacion-der')}
        </div>
        <p class="info-partido">${liga} · ${fechaTexto}, ${horaTexto} · marcador probable ${pronosticos.marcadorProbable}</p>
        ${h2hHTML(h2h)}
        ${pronosticos.pocaData ? `<p class="aviso-datos">⚠ Datos limitados (${pronosticos.partidosMin} partidos analizados) · pronóstico menos confiable</p>` : ''}

        <div class="lista-mercados">
          ${filaMercado(pronosticos.fija)}
          ${filaMercado(pronosticos.conFe)}
          ${filaMercado(pronosticos.sonadora)}
          ${filaMercado(pronosticos.extra)}
        </div>

        <div class="combos-partido">
          <p class="combos-partido-titulo">Combina en este partido</p>
          ${pronosticos.combosPartido.map(comboPartidoHTML).join('')}
        </div>
      </div>
    `;
  }

  // ============ GENERADOR DE COMBINADAS ENTRE PARTIDOS ============
  function mejorSeleccionDePartido(partido, pronosticos) {
    const opciones = [pronosticos.fija, pronosticos.conFe, pronosticos.sonadora, pronosticos.extra];
    let mejor = opciones[0];
    opciones.forEach(op => { if (op.probabilidad > mejor.probabilidad) mejor = op; });
    return {
      equipos: `${partido.homeTeam.name} vs ${partido.awayTeam.name}`,
      tipo: mejor.tipo,
      mercado: mejor.mercado,
      seleccion: mejor.seleccion,
      probabilidad: mejor.probabilidad
    };
  }

  function armarCombinada(piernas) {
    let probCombinada = 1;
    piernas.forEach(p => { probCombinada *= (p.probabilidad / 100); });
    return {
      piernas,
      probabilidad: Math.round(probCombinada * 100 * 10) / 10
    };
  }

  function tarjetaCombinadaHTML(etiqueta, combinada) {
    const piernasHTML = combinada.piernas.map((p, idx) => `
      <div class="pierna-combinada">
        <span class="num">${idx + 1}</span>
        ${puntoMercado(p.tipo)}
        <span class="detalle"><strong>${p.equipos}</strong><br>${p.mercado}: ${p.seleccion}</span>
        <span class="pct">${p.probabilidad}%</span>
      </div>
    `).join('');

    return `
      <div class="tarjeta-combinada">
        <div class="encabezado-combinada">
          <span class="etiqueta-combinada">${etiqueta}</span>
          <span class="prob-combinada" style="color:${combinada.probabilidad >= 30 ? 'var(--green)' : 'var(--gold)'}">${combinada.probabilidad}%</span>
        </div>
        ${piernasHTML}
      </div>
    `;
  }

  function renderCombinadas(listaSelecciones) {
    const contenedor = document.getElementById('bloque-combinadas');

    if (listaSelecciones.length < 2) {
      contenedor.innerHTML = '';
      return;
    }

    const ordenadas = [...listaSelecciones].sort((a, b) => b.probabilidad - a.probabilidad);

    let html = `
      <div class="bloque-combinadas">
        <h3>Combinadas sugeridas</h3>
        <p class="subtitulo-combinadas">Armadas con la selección más probable de cada partido cargado. La probabilidad mostrada es la combinada real (multiplica cada pierna), no una cuota.</p>
    `;

    const doble = armarCombinada(ordenadas.slice(0, 2));
    html += tarjetaCombinadaHTML('Combinada doble', doble);

    if (ordenadas.length >= 3) {
      const triple = armarCombinada(ordenadas.slice(0, 3));
      html += tarjetaCombinadaHTML('Combinada triple', triple);
    }

    html += `
        <div class="aviso-riesgo">
          <span class="icono">⚠️</span>
          <span>Cada pierna que agregas multiplica el riesgo: todas tienen que acertar para ganar la combinada. Estas son de las combinaciones estadísticamente más sólidas con los partidos de hoy, pero ningún pronóstico garantiza un resultado. Apuesta solo lo que estás dispuesto a perder.</span>
        </div>
      </div>
    `;

    contenedor.innerHTML = html;
  }

  // ============ TRACKEADOR DE ACIERTOS ============
  // Guarda cada pronostico generado (partido + mercado + probabilidad + seleccion)
  // en localStorage. Cuando el partido ya termino (football-data.org lo marca como
  // FINISHED), comparamos la seleccion contra el resultado real y calculamos si acerto.
  // Esto le da al usuario evidencia real del desempeño del modelo, no solo promesas.
  const CLAVE_HISTORIAL = 'fulbito_historial_pronosticos';

  function leerHistorial() {
    try {
      const crudo = localStorage.getItem(CLAVE_HISTORIAL);
      return crudo ? JSON.parse(crudo) : [];
    } catch (e) {
      console.warn("No se pudo leer el historial", e);
      return [];
    }
  }

  function guardarHistorial(historial) {
    try {
      // Limitamos a los ultimos 200 registros para no crecer sin control
      const recortado = historial.slice(-200);
      localStorage.setItem(CLAVE_HISTORIAL, JSON.stringify(recortado));
    } catch (e) {
      console.warn("No se pudo guardar el historial", e);
    }
  }

  function registrarPronostico(partido, pronosticos) {
    const historial = leerHistorial();

    // Evitar duplicados: si ya guardamos este partido, no lo agregamos de nuevo
    const yaExiste = historial.some(h => h.partidoId === partido.id);
    if (yaExiste) return;

    historial.push({
      partidoId: partido.id,
      local: partido.homeTeam.name,
      visita: partido.awayTeam.name,
      fecha: partido.utcDate,
      liga: partido.competition.name,
      seleccionFija: pronosticos.fija.seleccion,
      seleccionConFe: pronosticos.conFe.seleccion,
      seleccionSonadora: pronosticos.sonadora.seleccion,
      seleccionExtra: pronosticos.extra.seleccion,
      favoritoLocal: pronosticos.favoritoLocal,
      nombreFavorito: pronosticos.nombreFavorito,
      lineaGoles: parseFloat(pronosticos.fija.seleccion.replace('Menos de ', '')),
      verificado: false
    });

    guardarHistorial(historial);
  }

  function evaluarPronostico(registro, marcadorLocal, marcadorVisita) {
    const totalGoles = marcadorLocal + marcadorVisita;
    const golesFavorito = registro.favoritoLocal ? marcadorLocal : marcadorVisita;
    const golesRivalFavorito = registro.favoritoLocal ? marcadorVisita : marcadorLocal;

    const aciertoFija = totalGoles < registro.lineaGoles;
    const aciertoConFe = registro.favoritoLocal ? (marcadorLocal >= marcadorVisita) : (marcadorVisita >= marcadorLocal);
    const aciertoSonadora = golesFavorito >= 1;
    const aciertoExtra = (golesFavorito - golesRivalFavorito) >= 2;

    return { aciertoFija, aciertoConFe, aciertoSonadora, aciertoExtra };
  }

  async function actualizarHistorialConResultados() {
    const historial = leerHistorial();
    const pendientes = historial.filter(h => !h.verificado);
    if (pendientes.length === 0) return leerHistorial();

    // Consultamos partidos ya jugados de los ultimos 10 dias, para cruzar resultados
    const hoy = new Date();
    const hace10dias = new Date(hoy);
    hace10dias.setDate(hace10dias.getDate() - 10);

    try {
      const url = `${BACKEND_URL}/api/partidos?competitions=${COMPETICIONES}&dateFrom=${formatearFecha(hace10dias)}&dateTo=${formatearFecha(hoy)}`;
      const resp = await fetch(url);
      const datos = await resp.json();
      const finalizados = (datos.matches || []).filter(p => p.status === 'FINISHED');

      const mapaResultados = {};
      finalizados.forEach(p => { mapaResultados[p.id] = p; });

      let cambios = false;
      historial.forEach(registro => {
        if (registro.verificado) return;
        const partido = mapaResultados[registro.partidoId];
        if (!partido || !partido.score || partido.score.fullTime.home === null) return;

        const evaluacion = evaluarPronostico(registro, partido.score.fullTime.home, partido.score.fullTime.away);
        Object.assign(registro, evaluacion, {
          verificado: true,
          marcadorFinal: `${partido.score.fullTime.home}-${partido.score.fullTime.away}`
        });
        cambios = true;
      });

      if (cambios) guardarHistorial(historial);
    } catch (e) {
      console.warn("No se pudo actualizar el historial con resultados", e);
    }

    return leerHistorial();
  }

  function calcularEstadisticasHistorial(historial) {
    const verificados = historial.filter(h => h.verificado);
    if (verificados.length === 0) return null;

    function pct(campo) {
      const aciertos = verificados.filter(h => h[campo]).length;
      return Math.round((aciertos / verificados.length) * 100);
    }

    // Precisión general: junta los aciertos de los 4 mercados en una sola cifra,
    // para dar un numero resumen ademas del detalle por mercado.
    const camposMercado = ['aciertoFija', 'aciertoConFe', 'aciertoSonadora', 'aciertoExtra'];
    let totalAciertos = 0;
    let totalEvaluaciones = 0;
    verificados.forEach(h => {
      camposMercado.forEach(campo => {
        totalEvaluaciones++;
        if (h[campo]) totalAciertos++;
      });
    });
    const general = totalEvaluaciones > 0 ? Math.round((totalAciertos / totalEvaluaciones) * 100) : 0;

    return {
      totalVerificados: verificados.length,
      general,
      fija: pct('aciertoFija'),
      conFe: pct('aciertoConFe'),
      sonadora: pct('aciertoSonadora'),
      extra: pct('aciertoExtra'),
      ultimos: verificados.slice(-8).reverse()
    };
  }

  function reiniciarHistorial() {
    if (!confirm('¿Seguro que quieres borrar todo el historial de aciertos guardado en este navegador? Esta acción no se puede deshacer.')) return;
    try {
      localStorage.removeItem(CLAVE_HISTORIAL);
    } catch (e) {
      console.warn("No se pudo borrar el historial", e);
    }
    renderHistorial(null);
  }

  function renderHistorial(estadisticas) {
    const contenedor = document.getElementById('bloque-historial');

    if (!estadisticas) {
      contenedor.innerHTML = `
        <div class="bloque-combinadas">
          <h3>Historial de aciertos</h3>
          <p class="subtitulo-combinadas">Todavía no hay partidos anteriores verificados en este navegador. A medida que uses la página y los partidos que viste terminen, aquí vas a ver qué tan bien acertó el modelo, con datos reales.</p>
        </div>
      `;
      return;
    }

    const filasUltimos = estadisticas.ultimos.map(h => `
      <div class="pierna-combinada">
        <span class="num">${h.aciertoConFe ? '✓' : '✕'}</span>
        <span class="detalle"><strong>${h.local} vs ${h.visita}</strong><br>Resultado: ${h.marcadorFinal} · Favorito: ${h.nombreFavorito}</span>
      </div>
    `).join('');

    document.getElementById('bloque-historial').innerHTML = `
      <div class="bloque-combinadas">
        <div class="historial-header">
          <h3>Historial de aciertos</h3>
          <button class="boton-reiniciar" onclick="reiniciarHistorial()">Reiniciar</button>
        </div>
        <p class="subtitulo-combinadas">Basado en ${estadisticas.totalVerificados} pronósticos ya verificados en este navegador (se guarda localmente, no se comparte entre dispositivos).</p>

        <div class="precision-general">
          <span class="precision-general-num">${estadisticas.general}%</span>
          <span class="precision-general-label">Precisión general del modelo<br>(promedio de los 4 mercados combinados)</span>
        </div>

        <div class="lista-mercados">
          <div class="fila-mercado mercado-fija"><span class="fila-titulo">La Fija</span><span class="fila-porcentaje">${estadisticas.fija}%</span><p class="fila-mercado-nombre">acierto real</p></div>
          <div class="fila-mercado mercado-confe"><span class="fila-titulo">Con Fe</span><span class="fila-porcentaje">${estadisticas.conFe}%</span><p class="fila-mercado-nombre">acierto real</p></div>
          <div class="fila-mercado mercado-sonadora"><span class="fila-titulo">La Soñadora</span><span class="fila-porcentaje">${estadisticas.sonadora}%</span><p class="fila-mercado-nombre">acierto real</p></div>
          <div class="fila-mercado mercado-extra"><span class="fila-titulo">Extra</span><span class="fila-porcentaje">${estadisticas.extra}%</span><p class="fila-mercado-nombre">acierto real</p></div>
        </div>

        <div class="tarjeta-combinada" style="margin-top:16px;">
          <div class="encabezado-combinada"><span class="etiqueta-combinada">Últimos verificados</span></div>
          ${filasUltimos}
        </div>
      </div>
    `;
  }

  function esperar(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // ============ CARGA PRINCIPAL ============
  async function cargarPartidos(tipoFecha) {
    const contenedor = document.getElementById('contenedor-partidos');
    const contenedorCombinadas = document.getElementById('bloque-combinadas');
    contenedor.innerHTML = '<p style="text-align:center; color:#8fa896;">Cargando partidos...</p>';
    contenedorCombinadas.innerHTML = '';

    const hoy = new Date();
    let fechaInicio, fechaFin, diaObjetivo;

    if (tipoFecha === 'hoy') {
      diaObjetivo = formatearFecha(hoy);
      const finConsulta = new Date(hoy);
      finConsulta.setDate(finConsulta.getDate() + 1);
      fechaInicio = formatearFecha(hoy);
      fechaFin = formatearFecha(finConsulta);
    } else if (tipoFecha === 'manana') {
      const manana = new Date(hoy);
      manana.setDate(manana.getDate() + 1);
      diaObjetivo = formatearFecha(manana);
      const inicioConsulta = new Date(hoy);
      const finConsulta = new Date(manana);
      finConsulta.setDate(finConsulta.getDate() + 1);
      fechaInicio = formatearFecha(inicioConsulta);
      fechaFin = formatearFecha(finConsulta);
    } else if (tipoFecha === 'semana') {
      const finSemana = new Date(hoy);
      finSemana.setDate(finSemana.getDate() + 7);
      fechaInicio = formatearFecha(hoy);
      fechaFin = formatearFecha(finSemana);
    }

    let partidos = await obtenerPartidos(fechaInicio, fechaFin);

    if (partidos.error) {
      contenedor.innerHTML = `<p style="text-align:center; color:#ff6b6b;">Error: ${partidos.mensaje}</p>`;
      return;
    }

    if (diaObjetivo) {
      partidos = partidos.filter(p => fechaLocalDePartido(p.utcDate) === diaObjetivo);
    }

    if (partidos.length === 0) {
      contenedor.innerHTML = `<p style="text-align:center; color:#8fa896;">No hay partidos para mostrar en este rango (${fechaInicio} a ${fechaFin}).</p>`;
      return;
    }

    partidos = partidos.slice(0, 5);

    contenedor.innerHTML = '';
    const seleccionesParaCombinar = [];

    for (let idx = 0; idx < partidos.length; idx++) {
      const partido = partidos[idx];

      // Espaciamos las peticiones entre partido y partido (excepto el primero)
      // para no disparar varias peticiones de golpe y chocar con el limite
      // de la API gratuita (10 peticiones por minuto).
      if (idx > 0) await esperar(700);

      const codigoLiga = partido.competition.code;
      const [statsLocal, statsVisita, h2h] = await Promise.all([
        obtenerStatsEquipo(partido.homeTeam.id, codigoLiga),
        obtenerStatsEquipo(partido.awayTeam.id, codigoLiga),
        obtenerHeadToHead(partido.id)
      ]);

      const pronosticos = generarPronosticos(statsLocal, statsVisita, partido.homeTeam.name, partido.awayTeam.name, h2h);
      contenedor.innerHTML += crearTarjetaHTML(partido, pronosticos, statsLocal, statsVisita, h2h);

      seleccionesParaCombinar.push(mejorSeleccionDePartido(partido, pronosticos));
      registrarPronostico(partido, pronosticos);
    }

    renderCombinadas(seleccionesParaCombinar);

    const historialActualizado = await actualizarHistorialConResultados();
    renderHistorial(calcularEstadisticasHistorial(historialActualizado));
  }

  function cambiarFecha(tipo, event) {
    document.querySelectorAll('.pestaña').forEach(btn => btn.classList.remove('activa'));
    event.target.classList.add('activa');
    cargarPartidos(tipo);
  }

  cargarPartidos('hoy');

  if (window.location.hash === '#pronosticos') {
    entrar();
  }
</script>
