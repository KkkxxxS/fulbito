<!DOCTYPE html>
<html lang="es-PERU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fulbito</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bloqueado">

<div class="contenedor" id="inicio">
    <h1>Bienvenido a fulbito</h1>
    <p>full fulbitoo.</p>
    <a href="#pronosticos" class="boton-redireccion" onclick="entrar()">entra aqui</a>
</div>

<section id="pronosticos" class="seccion-pronosticos">
    <h2>Pronósticos de hoy</h2>

    <div class="pestañas-fecha">
        <button class="pestaña activa" onclick="cambiarFecha('hoy', event)">Hoy</button>
        <button class="pestaña" onclick="cambiarFecha('manana', event)">Mañana</button>
        <button class="pestaña" onclick="cambiarFecha('semana', event)">Esta semana</button>
    </div>

    <div id="contenedor-partidos">
        <p style="text-align:center; color:#8fa896;">Cargando partidos...</p>
    </div>

    <div id="bloque-combinadas"></div>

</section>

<script>
  // ============ CONFIGURACION ============
  const BACKEND_URL = "https://fulbito-forh.onrender.com";
  const COMPETICIONES = "PL,PD,BL1,SA,FL1,CL";

  const cache = {};

  function formatearFecha(date) {
    const anio = date.getFullYear();
    const mes = String(date.getMonth() + 1).padStart(2, '0');
    const dia = String(date.getDate()).padStart(2, '0');
    return `${anio}-${mes}-${dia}`;
  }

  function fechaLocalDePartido(utcDateStr) {
    return formatearFecha(new Date(utcDateStr));
  }

  function entrar() {
    document.body.classList.remove('bloqueado');
    document.getElementById('inicio').style.display = 'none';
  }

  async function obtenerPartidos(fechaInicio, fechaFin) {
    const claveCache = `matches-${fechaInicio}-${fechaFin}`;
    if (cache[claveCache]) return cache[claveCache];

    try {
      const url = `${BACKEND_URL}/api/partidos?competitions=${COMPETICIONES}&dateFrom=${fechaInicio}&dateTo=${fechaFin}`;
      const resp = await fetch(url);
      const datos = await resp.json();

      if (datos.error || datos.errorCode) {
        console.error("Respuesta con error de la API:", datos);
        return { error: true, mensaje: datos.message || datos.error || "Error desconocido de la API" };
      }

      const partidos = (datos.matches || []).filter(p => p.status === 'SCHEDULED' || p.status === 'TIMED');
      cache[claveCache] = partidos;
      return partidos;
    } catch (e) {
      console.error("Error trayendo partidos", e);
      return { error: true, mensaje: e.message };
    }
  }

  // ============ CONFIABILIDAD DE LA DATA ============
  // Un equipo con pocos partidos jugados en el rango consultado tiene un promedio
  // de goles muy ruidoso (ej. 2 partidos y una goleada dispara el numero). El shrinkage
  // bayesiano "atrae" ese promedio hacia el promedio general de gol de una liga profesional
  // en proporcion a cuanta data real hay detras. Con 0 partidos, el valor es 100% el promedio
  // de liga; con PARTIDOS_CONFIANZA_PLENA partidos o mas, se confia 100% en el dato del equipo.
  const PROMEDIO_LIGA_GOLES = 1.35;
  const PARTIDOS_CONFIANZA_PLENA = 10;
  const PARTIDOS_MINIMOS_CONFIABLES = 5;

  function aplicarShrinkage(valor, partidosJugados) {
    const peso = Math.min(partidosJugados / PARTIDOS_CONFIANZA_PLENA, 1);
    return valor * peso + PROMEDIO_LIGA_GOLES * (1 - peso);
  }

  // ============ PONDERACION POR RECENCIA ============
  function pesosRecencia(cantidad) {
    const base = [1.0, 0.8, 0.65, 0.5, 0.4, 0.32, 0.26, 0.2];
    const pesos = [];
    for (let i = 0; i < cantidad; i++) {
      pesos.push(base[i] !== undefined ? base[i] : 0.15);
    }
    return pesos;
  }

  function promedioPonderado(valores, pesos) {
    if (valores.length === 0) return 0;
    let sumaValores = 0, sumaPesos = 0;
    for (let i = 0; i < valores.length; i++) {
      sumaValores += valores[i] * pesos[i];
      sumaPesos += pesos[i];
    }
    return sumaPesos > 0 ? sumaValores / sumaPesos : 0;
  }

  async function obtenerStatsEquipo(teamId) {
    const claveCache = `stats-${teamId}`;
    if (cache[claveCache]) return cache[claveCache];

    try {
      const url = `${BACKEND_URL}/api/equipo/${teamId}/stats`;
      const resp = await fetch(url);
      const datos = await resp.json();
      const partidos = datos.matches || [];

      const partidosOrdenados = [...partidos].sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));

      let victorias = 0, empates = 0, derrotas = 0;

      const golesFavorLocal = [], golesContraLocal = [];
      const golesFavorVisita = [], golesContraVisita = [];
      const golesFavorTodos = [], golesContraTodos = [];

      partidosOrdenados.forEach(p => {
        const esLocal = p.homeTeam.id === teamId;
        const golesEquipo = (esLocal ? p.score.fullTime.home : p.score.fullTime.away) ?? 0;
        const golesRival = (esLocal ? p.score.fullTime.away : p.score.fullTime.home) ?? 0;

        if (golesEquipo > golesRival) victorias++;
        else if (golesEquipo === golesRival) empates++;
        else derrotas++;

        golesFavorTodos.push(golesEquipo);
        golesContraTodos.push(golesRival);

        if (esLocal) {
          golesFavorLocal.push(golesEquipo);
          golesContraLocal.push(golesRival);
        } else {
          golesFavorVisita.push(golesEquipo);
          golesContraVisita.push(golesRival);
        }
      });

      const cantidad = partidosOrdenados.length || 1;
      const pesosTodos = pesosRecencia(golesFavorTodos.length);
      const pesosLocal = pesosRecencia(golesFavorLocal.length);
      const pesosVisita = pesosRecencia(golesFavorVisita.length);

      const promTodosFavor = promedioPonderado(golesFavorTodos, pesosTodos);
      const promTodosContra = promedioPonderado(golesContraTodos, pesosTodos);

      const promLocalFavorCrudo = golesFavorLocal.length > 0 ? promedioPonderado(golesFavorLocal, pesosLocal) : promTodosFavor;
      const promLocalContraCrudo = golesContraLocal.length > 0 ? promedioPonderado(golesContraLocal, pesosLocal) : promTodosContra;
      const promVisitaFavorCrudo = golesFavorVisita.length > 0 ? promedioPonderado(golesFavorVisita, pesosVisita) : promTodosFavor;
      const promVisitaContraCrudo = golesContraVisita.length > 0 ? promedioPonderado(golesContraVisita, pesosVisita) : promTodosContra;

      // Shrinkage: mientras menos partidos como local/visita tenga el equipo,
      // mas se acerca su promedio al promedio general de la liga (evita numeros disparados por poca muestra).
      const promLocalFavor = aplicarShrinkage(promLocalFavorCrudo, golesFavorLocal.length);
      const promLocalContra = aplicarShrinkage(promLocalContraCrudo, golesContraLocal.length);
      const promVisitaFavor = aplicarShrinkage(promVisitaFavorCrudo, golesFavorVisita.length);
      const promVisitaContra = aplicarShrinkage(promVisitaContraCrudo, golesContraVisita.length);

      const stats = {
        promedioGolesFavor: promTodosFavor,
        promedioGolesContra: promTodosContra,
        puntosPromedio: (victorias * 3 + empates) / cantidad,
        partidosJugados: partidosOrdenados.length,
        local: { golesFavor: promLocalFavor, golesContra: promLocalContra },
        visita: { golesFavor: promVisitaFavor, golesContra: promVisitaContra }
      };

      cache[claveCache] = stats;
      return stats;
    } catch (e) {
      console.error("Error trayendo stats equipo", teamId, e);
      const fallback = { golesFavor: 1, golesContra: 1 };
      return { promedioGolesFavor: 1, promedioGolesContra: 1, puntosPromedio: 1, partidosJugados: 0, local: fallback, visita: fallback };
    }
  }

  // ============ MODELO DE POISSON ============
  function factorial(n) {
    let r = 1;
    for (let i = 2; i <= n; i++) r *= i;
    return r;
  }

  function poisson(k, lambda) {
    return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
  }

  // ============ CORRECCION DIXON-COLES ============
  // El modelo de Poisson puro asume que los goles del local y del visitante son
  // totalmente independientes, pero en partidos reales los marcadores bajos (0-0, 1-0,
  // 0-1, 1-1) estan levemente correlacionados: hay una pizca mas de empates a 0 o 1 gol
  // de lo que Poisson predice solo. Dixon-Coles corrige justo esas 4 celdas con un
  // factor tau; el resto de la matriz queda igual. RHO_DIXON_COLES es la fuerza de esa
  // correlacion, tipicamente entre -0.05 y -0.15 en ligas profesionales de futbol.
  const RHO_DIXON_COLES = -0.08;

  function tauDixonColes(golesLocal, golesVisita, lambdaLocal, lambdaVisita, rho) {
    if (golesLocal === 0 && golesVisita === 0) return 1 - (lambdaLocal * lambdaVisita * rho);
    if (golesLocal === 0 && golesVisita === 1) return 1 + (lambdaLocal * rho);
    if (golesLocal === 1 && golesVisita === 0) return 1 + (lambdaVisita * rho);
    if (golesLocal === 1 && golesVisita === 1) return 1 - rho;
    return 1;
  }

  function matrizMarcadores(lambdaLocal, lambdaVisita, maxGoles = 6) {
    const matriz = [];
    let sumaTotal = 0;
    for (let i = 0; i <= maxGoles; i++) {
      matriz[i] = [];
      for (let j = 0; j <= maxGoles; j++) {
        const base = poisson(i, lambdaLocal) * poisson(j, lambdaVisita);
        const ajustado = base * tauDixonColes(i, j, lambdaLocal, lambdaVisita, RHO_DIXON_COLES);
        matriz[i][j] = ajustado;
        sumaTotal += ajustado;
      }
    }
    // Renormalizamos para que las probabilidades de toda la matriz sigan sumando 1
    // (el ajuste de las 4 celdas altera levemente el total).
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        matriz[i][j] = matriz[i][j] / sumaTotal;
      }
    }
    return matriz;
  }

  const FACTOR_LOCALIA = 1.1;

  function generarPronosticos(statsLocal, statsVisita, nombreLocal, nombreVisita) {
    let lambdaLocal = (statsLocal.local.golesFavor + statsVisita.visita.golesContra) / 2;
    let lambdaVisita = (statsVisita.visita.golesFavor + statsLocal.local.golesContra) / 2;

    lambdaLocal *= FACTOR_LOCALIA;

    lambdaLocal = Math.max(lambdaLocal, 0.3);
    lambdaVisita = Math.max(lambdaVisita, 0.3);

    const matriz = matrizMarcadores(lambdaLocal, lambdaVisita);
    const maxGoles = matriz.length - 1;

    let pLocal = 0, pEmpate = 0, pVisita = 0;
    let marcadorTop = { i: 0, j: 0, p: 0 };
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        if (i > j) pLocal += matriz[i][j];
        else if (i === j) pEmpate += matriz[i][j];
        else pVisita += matriz[i][j];

        if (matriz[i][j] > marcadorTop.p) marcadorTop = { i, j, p: matriz[i][j] };
      }
    }

    const favoritoLocal = pLocal >= pVisita;
    const nombreFavorito = favoritoLocal ? nombreLocal : nombreVisita;

    const lineasCandidatas = [1.5, 2.5, 3.5, 4.5];
    let mejorLinea = 3.5, mejorProb = 0;
    lineasCandidatas.forEach(linea => {
      let p = 0;
      for (let i = 0; i <= maxGoles; i++) {
        for (let j = 0; j <= maxGoles; j++) {
          if (i + j < linea) p += matriz[i][j];
        }
      }
      if (p > mejorProb) { mejorProb = p; mejorLinea = linea; }
    });
    const fija = {
      tipo: "fija",
      titulo: "La Fija",
      mercado: "Total de goles",
      seleccion: `Menos de ${mejorLinea}`,
      probabilidad: Math.round(mejorProb * 100)
    };

    const probConFe = favoritoLocal ? (pLocal + pEmpate) : (pVisita + pEmpate);
    const conFe = {
      tipo: "confe",
      titulo: "Con Fe",
      mercado: "Doble oportunidad",
      seleccion: `${nombreFavorito} o Empate (${favoritoLocal ? '1X' : 'X2'})`,
      probabilidad: Math.round(probConFe * 100)
    };

    const lambdaFavorito = favoritoLocal ? lambdaLocal : lambdaVisita;
    const probSonadora = 1 - poisson(0, lambdaFavorito);
    const sonadora = {
      tipo: "sonadora",
      titulo: "La Soñadora",
      mercado: "Equipo marca",
      seleccion: `${nombreFavorito} marca`,
      probabilidad: Math.round(probSonadora * 100)
    };

    let probExtra = 0;
    for (let i = 0; i <= maxGoles; i++) {
      for (let j = 0; j <= maxGoles; j++) {
        const margen = favoritoLocal ? (i - j) : (j - i);
        if (margen >= 2) probExtra += matriz[i][j];
      }
    }
    const extra = {
      tipo: "extra",
      titulo: "Extra",
      mercado: "Hándicap asiático",
      seleccion: `${nombreFavorito} -1`,
      probabilidad: Math.round(probExtra * 100)
    };

    const marcadorProbable = `${marcadorTop.i}-${marcadorTop.j}`;

    // ============ COMBINACIONES DENTRO DEL MISMO PARTIDO ============
    // A diferencia de combinar partidos distintos (que son eventos independientes),
    // los mercados de UN MISMO partido estan correlacionados: si el favorito marca,
    // es mas probable que tambien gane. Por eso NO multiplicamos probabilidades sueltas,
    // sino que sumamos directamente las celdas de la matriz de marcadores que cumplen
    // TODAS las condiciones a la vez. Eso da la probabilidad conjunta real.
    function probabilidadConjunta(condiciones) {
      let p = 0;
      for (let i = 0; i <= maxGoles; i++) {
        for (let j = 0; j <= maxGoles; j++) {
          if (condiciones.every(cond => cond(i, j))) p += matriz[i][j];
        }
      }
      return p;
    }

    const esConFe = (i, j) => favoritoLocal ? (i >= j) : (j >= i);
    const esFija = (i, j) => (i + j) < mejorLinea;
    const esSonadora = (i, j) => favoritoLocal ? i >= 1 : j >= 1;

    const combosPartido = [];

    const probA = probabilidadConjunta([esConFe, esFija]);
    combosPartido.push({
      titulo: "Combinada segura",
      tipos: ["confe", "fija"],
      partes: [conFe.seleccion, fija.seleccion],
      probabilidad: Math.round(probA * 100)
    });

    const probB = probabilidadConjunta([esSonadora, esConFe]);
    combosPartido.push({
      titulo: "Combinada con gol",
      tipos: ["sonadora", "confe"],
      partes: [sonadora.seleccion, conFe.seleccion],
      probabilidad: Math.round(probB * 100)
    });

    // ============ CONFIABILIDAD DEL PRONOSTICO ============
    // Si alguno de los dos equipos tiene muy pocos partidos jugados en el rango consultado,
    // el pronostico se basa en poca evidencia real (aunque el shrinkage ya lo suaviza).
    // Se lo mostramos al usuario en vez de esconderlo.
    const partidosMin = Math.min(statsLocal.partidosJugados ?? 0, statsVisita.partidosJugados ?? 0);
    const pocaData = partidosMin < PARTIDOS_MINIMOS_CONFIABLES;

    return { fija, conFe, sonadora, extra, marcadorProbable, probMarcador: Math.round(marcadorTop.p * 100), combosPartido, partidosMin, pocaData };
  }

  // ============ ICONOS POR MERCADO ============
  const ICONOS_MERCADO = {
    fija: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.6" fill="currentColor"/></svg>',
    confe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    sonadora: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 15 9l7 1-5.2 4.9L18.2 22 12 18.3 5.8 22l1.4-7.1L2 10l7-1 3-6.5Z"/></svg>',
    extra: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>'
  };

  function iconoMercado(tipo) {
    return `<span class="fila-icono">${ICONOS_MERCADO[tipo] || ''}</span>`;
  }

  function puntoMercado(tipo) {
    return `<span class="punto-mercado punto-${tipo}"></span>`;
  }

  // ============ RENDER DE TARJETAS ============
  function filaMercado(datos) {
    return `
      <div class="fila-mercado mercado-${datos.tipo}">
        <div class="fila-header">
          ${iconoMercado(datos.tipo)}
          <span class="fila-porcentaje">${datos.probabilidad}%</span>
        </div>
        <span class="fila-titulo">${datos.titulo}</span>
        <div class="barra-probabilidad">
          <div class="barra-relleno" style="width:${datos.probabilidad}%"></div>
        </div>
        <p class="fila-mercado-nombre">${datos.mercado}</p>
        <p class="fila-seleccion">${datos.seleccion}</p>
      </div>
    `;
  }

  function comboPartidoHTML(combo) {
    const puntos = combo.tipos.map(puntoMercado).join('');
    return `
      <div class="combo-partido">
        <div class="combo-partido-header">
          <span>${puntos}${combo.titulo}</span>
          <span class="combo-partido-pct">${combo.probabilidad}%</span>
        </div>
        <p class="combo-partido-partes">${combo.partes.join(' + ')}</p>
      </div>
    `;
  }

  function crearTarjetaHTML(partido, pronosticos) {
    const local = partido.homeTeam.name;
    const visita = partido.awayTeam.name;
    const liga = partido.competition.name;
    const fecha = new Date(partido.utcDate);
    const fechaTexto = fecha.toLocaleDateString('es-PE', { day: '2-digit', month: 'short' });
    const horaTexto = fecha.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });

    return `
      <div class="tarjeta-partido">
        <div class="encabezado-partido">
          <span class="equipo">${local}</span>
          <span class="vs">VS</span>
          <span class="equipo">${visita}</span>
        </div>
        <p class="info-partido">${liga} · ${fechaTexto}, ${horaTexto} · marcador probable ${pronosticos.marcadorProbable}</p>
        ${pronosticos.pocaData ? `<p class="aviso-datos">⚠ Datos limitados (${pronosticos.partidosMin} partidos analizados) · pronóstico menos confiable</p>` : ''}

        <div class="lista-mercados">
          ${filaMercado(pronosticos.fija)}
          ${filaMercado(pronosticos.conFe)}
          ${filaMercado(pronosticos.sonadora)}
          ${filaMercado(pronosticos.extra)}
        </div>

        <div class="combos-partido">
          <p class="combos-partido-titulo">Combina en este partido</p>
          ${pronosticos.combosPartido.map(comboPartidoHTML).join('')}
        </div>
      </div>
    `;
  }

  // ============ GENERADOR DE COMBINADAS ============
  // Junta la mejor selección de cada partido (mayor probabilidad individual)
  // y arma combinadas de 2 y 3 partidos. La probabilidad combinada se calcula
  // multiplicando las probabilidades individuales (partidos distintos SÍ son
  // eventos independientes entre sí, a diferencia de mercados del mismo partido),
  // asi el numero que se muestra es honesto: entre mas piernas, mas baja la probabilidad real.
  function mejorSeleccionDePartido(partido, pronosticos) {
    const opciones = [pronosticos.fija, pronosticos.conFe, pronosticos.sonadora, pronosticos.extra];
    let mejor = opciones[0];
    opciones.forEach(op => { if (op.probabilidad > mejor.probabilidad) mejor = op; });
    return {
      equipos: `${partido.homeTeam.name} vs ${partido.awayTeam.name}`,
      tipo: mejor.tipo,
      mercado: mejor.mercado,
      seleccion: mejor.seleccion,
      probabilidad: mejor.probabilidad
    };
  }

  function armarCombinada(piernas) {
    let probCombinada = 1;
    piernas.forEach(p => { probCombinada *= (p.probabilidad / 100); });
    return {
      piernas,
      probabilidad: Math.round(probCombinada * 100 * 10) / 10
    };
  }

  function tarjetaCombinadaHTML(etiqueta, combinada) {
    const piernasHTML = combinada.piernas.map((p, idx) => `
      <div class="pierna-combinada">
        <span class="num">${idx + 1}</span>
        ${puntoMercado(p.tipo)}
        <span class="detalle"><strong>${p.equipos}</strong><br>${p.mercado}: ${p.seleccion}</span>
        <span class="pct">${p.probabilidad}%</span>
      </div>
    `).join('');

    return `
      <div class="tarjeta-combinada">
        <div class="encabezado-combinada">
          <span class="etiqueta-combinada">${etiqueta}</span>
          <span class="prob-combinada" style="color:${combinada.probabilidad >= 30 ? 'var(--green)' : 'var(--gold)'}">${combinada.probabilidad}%</span>
        </div>
        ${piernasHTML}
      </div>
    `;
  }

  function renderCombinadas(listaSelecciones) {
    const contenedor = document.getElementById('bloque-combinadas');

    if (listaSelecciones.length < 2) {
      contenedor.innerHTML = '';
      return;
    }

    const ordenadas = [...listaSelecciones].sort((a, b) => b.probabilidad - a.probabilidad);

    let html = `
      <div class="bloque-combinadas">
        <h3>Combinadas sugeridas</h3>
        <p class="subtitulo-combinadas">Armadas con la selección más probable de cada partido cargado. La probabilidad mostrada es la combinada real (multiplica cada pierna), no una cuota.</p>
    `;

    const doble = armarCombinada(ordenadas.slice(0, 2));
    html += tarjetaCombinadaHTML('Combinada doble', doble);

    if (ordenadas.length >= 3) {
      const triple = armarCombinada(ordenadas.slice(0, 3));
      html += tarjetaCombinadaHTML('Combinada triple', triple);
    }

    html += `
        <div class="aviso-riesgo">
          <span class="icono">⚠️</span>
          <span>Cada pierna que agregas multiplica el riesgo: todas tienen que acertar para ganar la combinada. Estas son de las combinaciones estadísticamente más sólidas con los partidos de hoy, pero ningún pronóstico garantiza un resultado. Apuesta solo lo que estás dispuesto a perder.</span>
        </div>
      </div>
    `;

    contenedor.innerHTML = html;
  }

  // ============ CARGA PRINCIPAL ============
  async function cargarPartidos(tipoFecha) {
    const contenedor = document.getElementById('contenedor-partidos');
    const contenedorCombinadas = document.getElementById('bloque-combinadas');
    contenedor.innerHTML = '<p style="text-align:center; color:#8fa896;">Cargando partidos...</p>';
    contenedorCombinadas.innerHTML = '';

    const hoy = new Date();
    let fechaInicio, fechaFin, diaObjetivo;

    if (tipoFecha === 'hoy') {
      diaObjetivo = formatearFecha(hoy);
      const finConsulta = new Date(hoy);
      finConsulta.setDate(finConsulta.getDate() + 1);
      fechaInicio = formatearFecha(hoy);
      fechaFin = formatearFecha(finConsulta);
    } else if (tipoFecha === 'manana') {
      const manana = new Date(hoy);
      manana.setDate(manana.getDate() + 1);
      diaObjetivo = formatearFecha(manana);
      const inicioConsulta = new Date(hoy);
      const finConsulta = new Date(manana);
      finConsulta.setDate(finConsulta.getDate() + 1);
      fechaInicio = formatearFecha(inicioConsulta);
      fechaFin = formatearFecha(finConsulta);
    } else if (tipoFecha === 'semana') {
      const finSemana = new Date(hoy);
      finSemana.setDate(finSemana.getDate() + 7);
      fechaInicio = formatearFecha(hoy);
      fechaFin = formatearFecha(finSemana);
    }

    let partidos = await obtenerPartidos(fechaInicio, fechaFin);

    if (partidos.error) {
      contenedor.innerHTML = `<p style="text-align:center; color:#ff6b6b;">Error: ${partidos.mensaje}</p>`;
      return;
    }

    if (diaObjetivo) {
      partidos = partidos.filter(p => fechaLocalDePartido(p.utcDate) === diaObjetivo);
    }

    if (partidos.length === 0) {
      contenedor.innerHTML = `<p style="text-align:center; color:#8fa896;">No hay partidos para mostrar en este rango (${fechaInicio} a ${fechaFin}).</p>`;
      return;
    }

    partidos = partidos.slice(0, 5);

    contenedor.innerHTML = '';
    const seleccionesParaCombinar = [];

    for (const partido of partidos) {
      const [statsLocal, statsVisita] = await Promise.all([
        obtenerStatsEquipo(partido.homeTeam.id),
        obtenerStatsEquipo(partido.awayTeam.id)
      ]);

      const pronosticos = generarPronosticos(statsLocal, statsVisita, partido.homeTeam.name, partido.awayTeam.name);
      contenedor.innerHTML += crearTarjetaHTML(partido, pronosticos);

      seleccionesParaCombinar.push(mejorSeleccionDePartido(partido, pronosticos));
    }

    renderCombinadas(seleccionesParaCombinar);
  }

  function cambiarFecha(tipo, event) {
    document.querySelectorAll('.pestaña').forEach(btn => btn.classList.remove('activa'));
    event.target.classList.add('activa');
    cargarPartidos(tipo);
  }

  cargarPartidos('hoy');

  if (window.location.hash === '#pronosticos') {
    entrar();
  }
</script>
